name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/4.6.3.stable
          cp /root/.local/share/godot/export_templates/4.6.3.stable/* /github/home/.local/share/godot/export_templates/4.6.3.stable/

      - name: Import project
        run: godot --headless --import 2>&1 || true
        timeout-minutes: 3

      - name: Verify gameplay regressions
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME=/tmp/dts-ci-data
          for test in economy_invariants cave_access presentation_feedback pacing character_selection shop_currency stamina_balance cave_simplification; do
            godot --headless --audio-driver Dummy -s "tests/$test.gd" 2>&1 | tee "/tmp/$test.log"
            if grep -Eq 'SCRIPT ERROR|Parse Error' "/tmp/$test.log"; then
              exit 1
            fi
          done
        timeout-minutes: 3

      - name: Export to Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html 2>&1
        timeout-minutes: 5

      - name: Add coi-serviceworker and CNAME
        run: |
          cp coi-serviceworker.min.js build/web/
          cp CNAME build/web/
          sed -i 's|<head>|<head>\n<script src="coi-serviceworker.min.js"></script>|' build/web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
